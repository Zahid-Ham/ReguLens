<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100" height="100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132E22"/>
      <stop offset="100%" stop-color="#285C45"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D37"/>
      <stop offset="100%" stop-color="#3B8262"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#132E22" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="24" fill="#FAFBF9" stroke="#E2EBE1" stroke-width="2" filter="url(#subtleShadow)"/>
  
  <g transform="translate(22, 22)">
